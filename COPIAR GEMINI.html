<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>ANALU • TEZZA PROMPTS</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins', sans-serif;
      background:
      radial-gradient(circle at top,#fff8fb 0%,#ffeef5 45%,#ffdbe8 100%);
      min-height:100vh;
      overflow-x:hidden;
      color:#744b5d;
      position:relative;
    }

    /* FUNDO */

    body::before,
    body::after{
      content:"🌸";
      position:fixed;
      font-size:120px;
      opacity:0.07;
      z-index:0;
      pointer-events:none;
      animation:float 7s ease-in-out infinite;
    }

    body::before{
      top:30px;
      left:20px;
    }

    body::after{
      bottom:30px;
      right:20px;
      animation-delay:2s;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px) rotate(0deg);
      }

      50%{
        transform:translateY(-10px) rotate(8deg);
      }
    }

    /* FLORES CAINDO */

    .falling-petals{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:0;
    }

    .falling-petals span{
      position:absolute;
      top:-10%;
      font-size:22px;
      opacity:0.7;
      animation:fall linear infinite;
    }

    .falling-petals span:nth-child(1){
      left:8%;
      animation-duration:12s;
    }

    .falling-petals span:nth-child(2){
      left:22%;
      animation-duration:15s;
    }

    .falling-petals span:nth-child(3){
      left:40%;
      animation-duration:13s;
    }

    .falling-petals span:nth-child(4){
      left:58%;
      animation-duration:17s;
    }

    .falling-petals span:nth-child(5){
      left:75%;
      animation-duration:14s;
    }

    .falling-petals span:nth-child(6){
      left:92%;
      animation-duration:11s;
    }

    @keyframes fall{

      0%{
        transform:translateY(-100px) rotate(0deg);
      }

      100%{
        transform:translateY(120vh) rotate(360deg);
      }

    }

    /* HEADER */

    header{
      position:relative;
      z-index:2;
      text-align:center;
      padding:70px 20px 45px;
    }

    .logo{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      margin-bottom:20px;
    }

    .logo span{
      font-size:4rem;
      font-weight:700;
      color:#d85f91;
      text-shadow:
      0 4px 20px rgba(255,140,180,0.35);
    }

    .flower{
      font-size:2.7rem;
      animation:pulse 3s infinite ease-in-out;
    }

    @keyframes pulse{
      0%,100%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.12);
      }
    }

    .sub{
      color:#9d7183;
      font-size:1rem;
      line-height:1.9;
      font-weight:500;
    }

    /* CARD */

    .container{
      position:relative;
      z-index:2;
      max-width:950px;
      margin:auto;
      padding:20px;
    }

    .prompt-box{
      background:rgba(255,255,255,0.55);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.7);
      border-radius:32px;
      padding:30px;
      box-shadow:
      0 12px 45px rgba(255,170,200,0.2);
      overflow:hidden;
      position:relative;
      transition:0.35s;
    }

    .prompt-box:hover{
      transform:translateY(-4px);
      box-shadow:
      0 20px 55px rgba(255,170,200,0.28);
    }

    .prompt-box::before{
      content:"";
      position:absolute;
      width:260px;
      height:260px;
      background:rgba(255,190,215,0.28);
      border-radius:50%;
      top:-120px;
      right:-120px;
      filter:blur(18px);
    }

    .prompt-title{
      position:relative;
      z-index:2;
      font-size:1.25rem;
      font-weight:600;
      color:#cf5f89;
      margin-bottom:18px;
      letter-spacing:1px;
    }

    pre{
      position:relative;
      z-index:2;
      white-space:pre-wrap;
      word-wrap:break-word;
      background:#fff9fc;
      border:1px solid #ffd6e5;
      border-radius:22px;
      padding:24px;
      line-height:1.8;
      font-size:0.95rem;
      color:#6c4c5c;
      box-shadow:
      inset 0 2px 10px rgba(255,190,215,0.08);
    }

    /* BOTÃO */

    button{
      position:relative;
      z-index:2;
      margin-top:24px;
      border:none;
      background:
      linear-gradient(135deg,#ffb7d3,#f48fb1,#eb6f9f);
      color:white;
      padding:14px 30px;
      border-radius:999px;
      cursor:pointer;
      font-size:1rem;
      font-weight:600;
      transition:0.3s;
      box-shadow:
      0 8px 25px rgba(236,114,156,0.35);
    }

    button:hover{
      transform:scale(1.05);
      box-shadow:
      0 14px 35px rgba(236,114,156,0.45);
    }

    .hint{
      margin-top:14px;
      color:#aa8192;
      font-size:0.82rem;
    }

    /* FOOTER */

    footer{
      position:relative;
      z-index:2;
      text-align:center;
      padding:45px 20px 30px;
      color:#9f7787;
      font-size:0.85rem;
      line-height:1.8;
    }

    /* EXPLOSÃO */

    .explosion-flower{
      position:fixed;
      font-size:26px;
      pointer-events:none;
      z-index:9999;
      animation:explode 1.5s ease-out forwards;
    }

    @keyframes explode{

      0%{
        opacity:1;
        transform:
        translate(0,0)
        scale(1)
        rotate(0deg);
      }

      100%{
        opacity:0;
        transform:
        translate(var(--x),var(--y))
        scale(1.8)
        rotate(360deg);
      }

    }

    /* MENSAGEM ROSA */

    @keyframes fadeMessage{

      0%{
        opacity:0;
        transform:
        translateX(-50%)
        translateY(20px);
      }

      15%{
        opacity:1;
        transform:
        translateX(-50%)
        translateY(0px);
      }

      85%{
        opacity:1;
      }

      100%{
        opacity:0;
        transform:
        translateX(-50%)
        translateY(20px);
      }

    }

    /* MOBILE */

    @media(max-width:700px){

      .logo span{
        font-size:2.7rem;
      }

      .flower{
        font-size:2rem;
      }

      .prompt-box{
        padding:22px;
      }

      pre{
        font-size:0.88rem;
      }

    }

  </style>
</head>

<body>

  <!-- FLORES -->

  <div class="falling-petals">
    <span>🌸</span>
    <span>🌸</span>
    <span>🌸</span>
    <span>🌸</span>
    <span>🌸</span>
    <span>🌸</span>
  </div>

  <!-- HEADER -->

  <header>

    <div class="logo">

      <div class="flower">🌸</div>

      <span>ANALU</span>

      <div class="flower">🌸</div>

    </div>

    <div class="sub">
      TEZZA PROMPTS OFICIAL
    </div>

  </header>

  <!-- CONTAINER -->

  <div class="container">

    <div class="prompt-box">

      <div class="prompt-title">
        ANALU COLABORADORA
      </div>

<pre id="prompt1">
GEMINI [MODO PRO]

[COLOQUE AQUI O SEU PROMPT]
</pre>

      <button onclick="copyPrompt(event, 'prompt1')">
        🌸 Copiar Prompt
      </button>

      <div class="hint">
        Clique para copiar automaticamente.
      </div>

    </div>

  </div>

  <!-- FOOTER -->

  <footer>
    MARQUE @analu_zpt <br>
    ANALU • TEZZA PROMPTS — Conteúdo protegido.
  </footer>

  <!-- SCRIPT -->

  <script>

    async function copyPrompt(event, id){

      const el = document.getElementById(id);

      try{

        await navigator.clipboard.writeText(el.innerText);

      } catch(err){

        const range = document.createRange();
        range.selectNodeContents(el);

        const selection = window.getSelection();

        selection.removeAllRanges();
        selection.addRange(range);

        document.execCommand('copy');

        selection.removeAllRanges();
      }

      createExplosion(event);

      showMessage();

    }

    function createExplosion(event){

      const amount = 45;

      for(let i = 0; i < amount; i++){

        const flower = document.createElement("div");

        flower.className = "explosion-flower";

        flower.innerHTML = "🌸";

        const x =
        (Math.random() - 0.5) * 700 + "px";

        const y =
        (Math.random() - 0.5) * 700 + "px";

        flower.style.setProperty('--x', x);
        flower.style.setProperty('--y', y);

        flower.style.left = event.clientX + "px";
        flower.style.top = event.clientY + "px";

        flower.style.fontSize =
        (18 + Math.random() * 30) + "px";

        document.body.appendChild(flower);

        setTimeout(() => {

          flower.remove();

        },1700);

      }

    }

    function showMessage(){

      const msg = document.createElement("div");

      msg.innerHTML = "🌸 Prompt copiado com sucesso!";

      msg.style.position = "fixed";
      msg.style.bottom = "30px";
      msg.style.left = "50%";
      msg.style.transform = "translateX(-50%)";
      msg.style.background =
      "linear-gradient(135deg,#ffb7d3,#f48fb1)";
      msg.style.color = "white";
      msg.style.padding = "14px 24px";
      msg.style.borderRadius = "999px";
      msg.style.fontWeight = "600";
      msg.style.zIndex = "99999";
      msg.style.boxShadow =
      "0 10px 30px rgba(236,114,156,0.35)";
      msg.style.animation =
      "fadeMessage 2.2s ease forwards";

      document.body.appendChild(msg);

      setTimeout(() => {

        msg.remove();

      },2200);

    }

  </script>

</body>
</html>
